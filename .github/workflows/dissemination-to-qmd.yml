name: Dissemination Issue to QMD

on:
  issues:
    types: [opened, edited]


jobs:
  create-qmd-from-issue:
    if: |
      contains(github.event.issue.labels.*.name, 'dissemination')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages:
            any::knitr
            any::rmarkdown
            any::data.table
            any::knitcitations
            any::stringr
            any::glue

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Extract issue fields and create QMD
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # The issue form writes each answer under a "### <label>" heading.
          # Labels must match .github/ISSUE_TEMPLATE/dissemination-post.yml
          # exactly, or the section comes out empty.
          field() {
            printf '%s' "$ISSUE_BODY" | awk -v h="### $1" '
              $0 == h {flag=1; next}
              /^### / {flag=0}
              flag {print}
            ' | sed -e 's/^_No response_$//' -e '/^[[:space:]]*$/d'
          }

          TITLE=$(field "Title" | head -1)
          SUMMARY=$(field "Summary" | tr '\n' ' ')
          QUESTION=$(field "What question did we ask and why is it important?")
          METHODS=$(field "How did we answer the question?")
          FINDINGS=$(field "What did we find?")
          IMPLICATIONS=$(field "What does this mean for the community and healthcare system?")
          SWEDISH=$(field "Swedish version (optional)")
          DOI=$(field "DOI / publication link" | head -1 | sed -e 's|^https\?://\(dx\.\)\?doi\.org/||' -e 's/^doi://I' | xargs)
          AUTHOR=$(field "Author" | head -1)

          [ -z "$TITLE" ] && TITLE="$ISSUE_TITLE"
          [ -z "$AUTHOR" ] && AUTHOR="Unknown"

          SLUG=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^[-]*//; s/[-]*$//')
          DATE=$(date +%Y-%m-%d)
          POST_DIR="post/$DATE-$SLUG"
          mkdir -p "$POST_DIR"

          QMD_FILE="$POST_DIR/index.qmd"
          SAFE_TITLE=$(printf '%s' "$TITLE" | sed 's/"/\\"/g')
          SAFE_SUMMARY=$(printf '%s' "$SUMMARY" | sed 's/"/\\"/g')
          SAFE_AUTHOR=$(printf '%s' "$AUTHOR" | sed 's/"/\\"/g')

          {
            printf '%s\n' '---'
            printf 'title: "%s"\n' "$SAFE_TITLE"
            printf '%s\n' 'description: |'
            printf '  %s\n' "$SAFE_SUMMARY"
            printf '%s\n' 'author:'
            printf '  - name: "%s"\n' "$SAFE_AUTHOR"
            printf 'date: %s\n' "$DATE"
            # The publications page links a paper to its post by matching this
            [ -n "$DOI" ] && printf 'doi: %s\n' "$DOI"
            printf '%s\n\n' '---'

            [ -n "$DOI" ] && printf 'Read the paper: [%s](https://doi.org/%s)\n\n' "$DOI" "$DOI"

            [ -n "$QUESTION" ]     && printf '## What question did we ask and why is it important?\n\n%s\n\n' "$QUESTION"
            [ -n "$METHODS" ]      && printf '## How did we answer the question?\n\n%s\n\n' "$METHODS"
            [ -n "$FINDINGS" ]     && printf '## What did we find?\n\n%s\n\n' "$FINDINGS"
            [ -n "$IMPLICATIONS" ] && printf '## What does this mean for the community and healthcare system?\n\n%s\n\n' "$IMPLICATIONS"
            [ -n "$SWEDISH" ]      && printf '## På svenska\n\n%s\n' "$SWEDISH" || true
          } > "$QMD_FILE"

          echo "Created $QMD_FILE"


      - name: Commit and push QMD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post/
          git commit -m "Add dissemination post from issue #${ISSUE_NUMBER}" || echo "No changes to commit"
          git push

      # No render here. Pushing the post to main triggers render-site.yml,
      # which builds the site and publishes it to the gh-pages branch.

      - name: Close the issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })

name: Render and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Safety net: rebuild weekly so a missed trigger cannot leave the site stale,
  # for example a publication-to-blog-post link that never got drawn.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Caches the installed library, so only the first run pays to build it
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::knitcitations
            any::RefManageR
            any::data.table
            any::stringr
            any::glue

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# The UTHR monogram, pink and ink version: the one made for white
# backgrounds such as the navbar
logo:
  small: resources/logo-uthr.svg
  medium: resources/logo-uthr.svg
  large: resources/logo-uthr.svg

# Colours from the UTHR monogram. Text and controls use only pairs that
# reach 4.5:1 on their background; pink, cyan and orange are too light for
# text on white and appear as rules and tints.
color:
  palette:
    # The monogram
    ink: "#1f2d3d"           # text, headings; 13.99:1 on white
    pink: "#d94d7b"          # shared stems; rules and accents only
    cyan: "#62cbde"          # the U; decoration only
    purple: "#9646e0"        # the T bar; button fills, white text 4.94:1
    orange: "#eb9135"        # the H; decoration only
    teal: "#2a9d8f"          # the R; borders and fills behind dark text

    # Shades for text and controls
    purple-black: "#2e1747"  # links and other purple text, 15.79:1 on white;
                             # only 1.13:1 against ink text, so links carry a
                             # pink underline
    purple-dark: "#7434b5"   # link hover, button hover, 7.24:1 on white
    teal-dark: "#1f7c71"     # badge fill and teal text, 5.02:1
    muted: "#56616e"         # secondary text, 6.3:1 on white
    pink-tint: "#fbe6ee"     # tag background, ink text 11.76:1
    surface: "#f6f7f9"       # footer and quiet panels
    line: "#e3e7ec"          # card borders and dividers
    chip: "#eef1f4"          # inactive filter buttons

  foreground: ink
  background: "#ffffff"
  primary: purple
  secondary: muted
  tertiary: teal-dark
  success: teal-dark
  warning: orange
  danger: pink
  info: purple
  light: "#ffffff"
  dark: ink
  link: purple-black

typography:
  fonts:
    - family: Fixel Text
      source: file
      files:
        - path: resources/fonts/FixelText-Regular.woff2
          weight: 400
        - path: resources/fonts/FixelText-SemiBold.woff2
          weight: 600
        - path: resources/fonts/FixelText-Bold.woff2
          weight: 700
    - family: Fixel Display
      source: file
      files:
        - path: resources/fonts/FixelDisplay-Bold.woff2
          weight: 700

  base:
    family: Fixel Text
    size: 16px
    line-height: 1.6

  headings:
    family: Fixel Display
    weight: 700
    color: ink

  link:
    color: purple-black

  monospace:
    family: "SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace"
